name: Release

on:
  push:
    branches: [rust]
    tags: ["bmair-v*"]

permissions:
  contents: read

concurrency:
  group: bmair-release
  cancel-in-progress: false

jobs:
  release-plan:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out release source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release
        id: plan
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo version must use stable major.minor.patch form: $version" >&2
            exit 1
          fi
          if ! grep -F "## [$version] - " CHANGELOG.md \
            | grep -Eq '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "CHANGELOG.md has no dated $version release entry" >&2
            exit 1
          fi
          tag="bmair-v${version}"
          if [[ "$GITHUB_REF" == refs/tags/bmair-v* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-parse "${tag}^{}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points at $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  rust:
    name: Build release
    uses: ./.github/workflows/rust.yml
    with:
      build_type: Release
      source_ref: ${{ github.sha }}
      release_build: true

  publish:
    name: Publish release
    needs: [release-plan, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-parse "${tag}^{}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points at $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" "$GITHUB_SHA" --message "BMAIR ${{ needs.release-plan.outputs.version }}"
            git push origin "$tag"
          fi
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bmair-*
          path: release-assets
          merge-multiple: true
      - name: Create aggregate checksums
        working-directory: release-assets
        shell: bash
        run: |
          checksum_manifest=$(mktemp)
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS \
            -printf '%f\n' \
            | sort | xargs sha256sum > "$checksum_manifest"
          mv "$checksum_manifest" SHA256SUMS
      - name: Create release notes
        shell: bash
        run: |
          tag_version="${{ needs.release-plan.outputs.version }}"
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" \
            --match='bmair-v[0-9]*' 2>/dev/null || true)
          awk -v version="$tag_version" '
            index($0, "## [" version "] - ") == 1 { found = 1 }
            found && /^## \[/ && index($0, "## [" version "] - ") != 1 { exit }
            found { print }
          ' CHANGELOG.md > changelog-notes.md
          if [[ ! -s changelog-notes.md ]]; then
            echo "failed to extract $tag_version from CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo "Release built from \`${GITHUB_SHA}\`."
            echo
            echo "All six native platform artifacts include version/build metadata."
            echo "Verify downloads against \`SHA256SUMS\`."
            echo
            if [[ -n "$previous_tag" ]]; then
              change_count=$(git rev-list --count "${previous_tag}..${GITHUB_SHA}")
              echo "${change_count} commits since \`${previous_tag}\`."
              echo
            fi
            cat changelog-notes.md
          } > release-notes.md
      - name: Stage, verify, and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          title="BMAIR ${{ needs.release-plan.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [[ "$is_draft" == false ]]; then
              expected_assets=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
              published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
              if [[ "$published_assets" != "$expected_assets" ]]; then
                echo "$tag is already published with an unexpected asset set" >&2
                diff <(printf '%s\n' "$expected_assets") \
                  <(printf '%s\n' "$published_assets") || true
                exit 1
              fi
              echo "$tag is already published with the complete asset set"
              exit 0
            fi
            gh release edit "$tag" --verify-tag --title "$title" \
              --notes-file release-notes.md
          else
            gh release create "$tag" --draft --verify-tag \
              --title "$title" --notes-file release-notes.md
          fi

          # Draft assets remain replaceable after an interrupted run. Once the
          # verified draft is published, repository immutability locks them.
          gh release upload "$tag" release-assets/* --clobber
          expected_assets=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          uploaded_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$uploaded_assets" != "$expected_assets" ]]; then
            echo "$tag draft does not contain the complete asset set" >&2
            diff <(printf '%s\n' "$expected_assets") \
              <(printf '%s\n' "$uploaded_assets") || true
            exit 1
          fi

          gh release edit "$tag" --draft=false --prerelease=false --latest \
            --verify-tag --title "$title" --notes-file release-notes.md
