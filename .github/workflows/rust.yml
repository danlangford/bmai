name: Rust CI

on:
  push:
    branches: [rust]
    tags: ["bmair-v*"]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      build_type:
        description: Cargo build profile
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  workflow_call:
    inputs:
      build_type:
        description: Cargo build profile
        required: false
        default: Release
        type: string
      source_ref:
        description: Git ref containing the Rust source
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  # Superseded PR runs are disposable. Default-branch runs must serialize so
  # only one workflow at a time can decide whether to create the release tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  release-plan:
    name: Validate version and changelog
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      describe: ${{ steps.plan.outputs.describe }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve release plan
        id: plan
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo version must use stable major.minor.patch form: $version" >&2
            exit 1
          fi
          tag="bmair-v${version}"
          publish=false
          describe=""
          tag_exists=false
          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ "$tag_exists" == true ]]; then
              echo "$tag is already released; bump Cargo and add a dated changelog entry before merge" >&2
              exit 1
            fi
            base_sha="${{ github.event.pull_request.base.sha }}"
            base_version=$(git show "${base_sha}:Cargo.toml" \
              | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "base Cargo version is invalid: $base_version" >&2
              exit 1
            fi
            highest_version=$(printf '%s\n%s\n' "$base_version" "$version" \
              | sort -V | tail -n 1)
            if [[ "$version" == "$base_version" || "$highest_version" != "$version" ]]; then
              echo "unreleased Cargo version $version must be greater than base version $base_version" >&2
              exit 1
            fi
            if ! grep -Fq "## [$version] - " CHANGELOG.md; then
              echo "CHANGELOG.md has no dated $version release entry" >&2
              exit 1
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/bmair-v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/rust ]]; then
            if [[ "$tag_exists" == true ]]; then
              tagged_commit=$(git rev-parse "${tag}^{}")
              if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
                echo "$tag already points at $tagged_commit, not $GITHUB_SHA" >&2
                exit 1
              fi
            fi
            # Keep same-commit reruns publishable if an earlier run created the
            # tag but failed while creating or uploading the GitHub release.
            publish=true
          fi

          if [[ "$publish" == true ]]; then
            if ! grep -Fq "## [$version] - " CHANGELOG.md; then
              echo "CHANGELOG.md has no dated $version release entry" >&2
              exit 1
            fi
            describe="${tag}-0-g${GITHUB_SHA:0:7}"
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "describe=$describe" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ matrix.platform }} ${{ matrix.arch }} / ${{ inputs.build_type || 'Release' }}
    needs: release-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux
            arch: x86_64
            primary: false
          - runner: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            primary: true
          - runner: windows-2025
            platform: Windows
            arch: x86_64
            primary: false
          - runner: windows-11-arm
            platform: Windows
            arch: arm64
            primary: false
          - runner: macos-15-intel
            platform: macOS
            arch: x86_64
            primary: false
          - runner: macos-15
            platform: macOS
            arch: arm64
            primary: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BMAIR_GIT_DESCRIBE: ${{ needs.release-plan.outputs.describe }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: ${{ matrix.primary && 'clippy,rustfmt' || '' }}
      - name: Select Cargo profile
        shell: bash
        run: |
          if [[ "$BUILD_TYPE" == "Release" ]]; then
            echo "CARGO_PROFILE=release" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=release" >> "$GITHUB_ENV"
          else
            echo "CARGO_PROFILE=dev" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=debug" >> "$GITHUB_ENV"
          fi
      - name: Check formatting
        if: matrix.primary
        run: cargo fmt --check
      - name: Lint
        if: matrix.primary
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --profile "$CARGO_PROFILE" --locked --all-targets --all-features
        shell: bash
      - name: Run expensive self-contained fixture tests
        if: matrix.primary
        run: cargo test --profile release --locked --lib -- --ignored
      - name: Build binary
        run: cargo build --profile "$CARGO_PROFILE" --locked --all-targets --all-features
        shell: bash
      - name: Prepare binary and build metadata
        shell: bash
        run: |
          artifact_base="bmair-${{ matrix.platform }}-${{ matrix.arch }}-${BUILD_TYPE}"
          executable="bmair"
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            executable="bmair.exe"
          fi
          suffix="${executable#bmair}"
          mkdir -p dist
          cp "target/${CARGO_OUTPUT_DIR}/${executable}" "dist/${artifact_base}${suffix}"
          reported_version=$("dist/${artifact_base}${suffix}" --version)
          if [[ "${{ needs.release-plan.outputs.publish }}" == true ]]; then
            release_version="${{ needs.release-plan.outputs.version }}"
            if [[ "$reported_version" != "bmair ${release_version} ("* ]]; then
              echo "tagged binary reports unexpected version: $reported_version" >&2
              exit 1
            fi
          fi
          {
            echo "Artifact: ${artifact_base}${suffix}"
            echo "Version: $reported_version"
            echo "Git-Commit: $GITHUB_SHA"
            echo "Git-Ref: $GITHUB_REF"
            echo "Platform: ${{ matrix.platform }}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Cargo-Profile: $CARGO_PROFILE"
            rustc --version
          } > "dist/${artifact_base}.build-info.txt"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifact_base}${suffix}" > "${artifact_base}.sha256"
          else
            shasum -a 256 "${artifact_base}${suffix}" > "${artifact_base}.sha256"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bmair-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.BUILD_TYPE }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  release:
    name: Publish release
    if: needs.release-plan.outputs.publish == 'true'
    needs: [release-plan, build-and-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag after successful builds
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-parse "${tag}^{}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points at $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" "$GITHUB_SHA" --message "BMAIR ${{ needs.release-plan.outputs.version }}"
            git push origin "$tag"
          fi
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bmair-*
          path: release-assets
          merge-multiple: true
      - name: Create aggregate checksums
        working-directory: release-assets
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS \
            -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
      - name: Create release notes
        shell: bash
        run: |
          tag_version="${{ needs.release-plan.outputs.version }}"
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" \
            --match='bmair-v[0-9]*' 2>/dev/null || true)
          awk -v version="$tag_version" '
            index($0, "## [" version "] - ") == 1 { found = 1 }
            found && /^## \[/ && index($0, "## [" version "] - ") != 1 { exit }
            found { print }
          ' CHANGELOG.md > changelog-notes.md
          if [[ ! -s changelog-notes.md ]]; then
            echo "failed to extract $tag_version from CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo "Release built from \`${GITHUB_SHA}\`."
            echo
            echo "All six native platform artifacts include version/build metadata."
            echo "Verify downloads against \`SHA256SUMS\`."
            echo
            if [[ -n "$previous_tag" ]]; then
              change_count=$(git rev-list --count "${previous_tag}..${GITHUB_SHA}")
              echo "${change_count} commits since \`${previous_tag}\`."
              echo
            fi
            cat changelog-notes.md
          } > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.release-plan.outputs.tag }}"
          title="BMAIR ${{ needs.release-plan.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --prerelease=false --latest --verify-tag \
              --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" release-assets/* --latest --verify-tag \
              --title "$title" --notes-file release-notes.md
          fi
