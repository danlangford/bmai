name: Build BMAIR

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Cargo build profile
        required: true
        default: Release
        type: choice
        options: [Release, Debug]
  workflow_call:
    inputs:
      build_type:
        description: Cargo build profile
        required: false
        default: Release
        type: string
      source_ref:
        description: Git ref containing the Rust source
        required: false
        default: ""
        type: string
      release_build:
        description: Build artifacts with an exact release version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  extended-tests:
    name: Extended tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Run expensive self-contained fixture tests
        run: cargo test --profile release --locked --lib -- --ignored

  build-and-test:
    name: ${{ matrix.platform }} ${{ matrix.arch }} / ${{ inputs.build_type || 'Release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: Linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, platform: Linux, arch: arm64 }
          - { runner: windows-2025, platform: Windows, arch: x86_64 }
          - { runner: windows-11-arm, platform: Windows, arch: arm64 }
          - { runner: macos-15-intel, platform: macOS, arch: x86_64 }
          - { runner: macos-15, platform: macOS, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Select build metadata
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release_build }}
        run: |
          if [[ "$RELEASE_BUILD" == true ]]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
            echo "BMAIR_GIT_DESCRIBE=bmair-v${version}-0-g${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
            echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Select Cargo profile
        shell: bash
        run: |
          if [[ "$BUILD_TYPE" == "Release" ]]; then
            echo "CARGO_PROFILE=release" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=release" >> "$GITHUB_ENV"
          else
            echo "CARGO_PROFILE=dev" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=debug" >> "$GITHUB_ENV"
          fi
      - name: Test
        shell: bash
        run: cargo test --profile "$CARGO_PROFILE" --locked --all-targets --all-features
      - name: Build binary
        shell: bash
        run: cargo build --profile "$CARGO_PROFILE" --locked --all-targets --all-features
      - name: Prepare binary and build metadata
        id: package
        shell: bash
        run: |
          executable="bmair"
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            executable="bmair.exe"
          fi
          reported_version=$("target/${CARGO_OUTPUT_DIR}/${executable}" --version)
          build_version=${reported_version#bmair }
          build_version=${build_version%% *}
          if [[ -z "$build_version" || "$build_version" == "$reported_version" ]]; then
            echo "could not extract build version from: $reported_version" >&2
            exit 1
          fi
          platform=$(printf '%s' '${{ matrix.platform }}' | tr '[:upper:]' '[:lower:]')
          profile=$(printf '%s' "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          artifact_base="bmair-${build_version}-${platform}-${{ matrix.arch }}-${profile}"
          suffix="${executable#bmair}"
          mkdir -p dist
          cp "target/${CARGO_OUTPUT_DIR}/${executable}" "dist/${artifact_base}${suffix}"
          if [[ -n "${EXPECTED_VERSION:-}" && "$reported_version" != "bmair ${EXPECTED_VERSION} ("* ]]; then
            echo "release binary reports unexpected version: $reported_version" >&2
            exit 1
          fi
          {
            echo "Artifact: ${artifact_base}${suffix}"
            echo "Version: $reported_version"
            echo "Git-Commit: $GITHUB_SHA"
            echo "Git-Ref: $GITHUB_REF"
            echo "Platform: ${{ matrix.platform }}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Cargo-Profile: $CARGO_PROFILE"
            rustc --version
          } > "dist/${artifact_base}.build-info.txt"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifact_base}${suffix}" > "${artifact_base}.sha256"
          else
            shasum -a 256 "${artifact_base}${suffix}" > "${artifact_base}.sha256"
          fi
          echo "artifact_name=${artifact_base}" >> "$GITHUB_OUTPUT"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: dist/*
