name: Rust CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      build_type:
        description: Cargo build profile
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  workflow_call:
    inputs:
      build_type:
        description: Cargo build profile
        required: false
        default: Release
        type: string
      source_ref:
        description: Git ref containing the Rust source
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  build-and-test:
    name: ${{ matrix.platform }} ${{ matrix.arch }} / ${{ inputs.build_type || 'Release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux
            arch: x86_64
            primary: false
          - runner: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            primary: true
          - runner: windows-2025
            platform: Windows
            arch: x86_64
            primary: false
          - runner: windows-11-arm
            platform: Windows
            arch: arm64
            primary: false
          - runner: macos-15-intel
            platform: macOS
            arch: x86_64
            primary: false
          - runner: macos-15
            platform: macOS
            arch: arm64
            primary: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: ${{ matrix.primary && 'clippy,rustfmt' || '' }}
      - name: Select Cargo profile
        shell: bash
        run: |
          if [[ "$BUILD_TYPE" == "Release" ]]; then
            echo "CARGO_PROFILE=release" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=release" >> "$GITHUB_ENV"
          else
            echo "CARGO_PROFILE=dev" >> "$GITHUB_ENV"
            echo "CARGO_OUTPUT_DIR=debug" >> "$GITHUB_ENV"
          fi
      - name: Check formatting
        if: matrix.primary
        run: cargo fmt --check
      - name: Lint
        if: matrix.primary
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --profile "$CARGO_PROFILE" --locked --all-targets --all-features
        shell: bash
      - name: Run expensive self-contained fixture tests
        if: matrix.primary
        run: cargo test --profile release --locked --lib -- --ignored
      - name: Build binary
        run: cargo build --profile "$CARGO_PROFILE" --locked --all-targets --all-features
        shell: bash
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: bmair-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.BUILD_TYPE }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/${{ env.CARGO_OUTPUT_DIR }}/bmair
            target/${{ env.CARGO_OUTPUT_DIR }}/bmair.exe
